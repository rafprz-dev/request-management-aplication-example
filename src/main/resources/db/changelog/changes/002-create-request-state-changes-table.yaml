databaseChangeLog:
  - changeSet:
      id: 002-create-request-state-changes-table
      author: rafprz
      comment: "Create the request_state_changes table (audit log backing RequestStateChangeEntity)"
      changes:
        - createTable:
            tableName: request_state_changes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: request_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: from_state
                  type: VARCHAR(20)
                  constraints:
                    nullable: true
              - column:
                  name: to_state
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: VARCHAR(1000)
                  constraints:
                    nullable: true
              - column:
                  name: changed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: request_state_changes
            baseColumnNames: request_id
            referencedTableName: requests
            referencedColumnNames: id
            constraintName: fk_request_state_changes_request_id
            onDelete: CASCADE
        - createIndex:
            indexName: idx_request_state_changes_request_id
            tableName: request_state_changes
            columns:
              - column:
                  name: request_id
  - changeSet:
      id: 002-request-state-changes-id-default-postgresql
      author: rafprz
      comment: "Default id generation for direct SQL inserts; the app itself always assigns ids via Hibernate."
      dbms: postgresql
      changes:
        - addDefaultValue:
            tableName: request_state_changes
            columnName: id
            defaultValueComputed: gen_random_uuid()
